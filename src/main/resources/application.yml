spring:
  application:
    name: multi-agent-customer-support
  profiles:
    default: scripted
  datasource:
    url: jdbc:mysql://localhost:3306/support
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

support:
  auto-limit-paise: 500000
